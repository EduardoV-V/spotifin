name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Check version
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          C=$(grep -oP "appVersion = '\K[^']+" lib/app/version.dart)
          if [ "$V" != "$C" ]; then
            echo "pubspec.yaml ($V) and lib/app/version.dart ($C) differ"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version v$V"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          $v = '${{ needs.meta.outputs.version }}'
          $src = (Resolve-Path 'build\windows\x64\runner\Release').Path
          New-Item -ItemType Directory -Path dist | Out-Null
          $dist = (Resolve-Path 'dist').Path
          Compress-Archive -Path "$src\*" -DestinationPath "$dist\Spotifin_Windows_x64_v$v.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$v" "/DSourceDir=$src" "/DOutputDir=$dist" "/DOutputName=Spotifin_Windows_x64_v${v}_Setup" packaging\windows\spotifin.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*

  linux:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: X64
            runner: ubuntu-22.04
            flutter_arch: x64
            deb_arch: amd64
            bundle: build/linux/x64/release/bundle
          - label: ARM64
            runner: ubuntu-22.04-arm
            flutter_arch: arm64
            deb_arch: arm64
            bundle: build/linux/arm64/release/bundle
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libmpv-dev mpv libsecret-1-dev libjsoncpp-dev dpkg-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: ${{ matrix.flutter_arch }}
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package
        run: |
          V='${{ needs.meta.outputs.version }}'
          mkdir -p dist
          tar -C "${{ matrix.bundle }}" -czf "dist/Spotifin_Linux${{ matrix.label }}_v${V}.tar.gz" .
          packaging/linux/build_deb.sh "$V" "${{ matrix.deb_arch }}" "${{ matrix.bundle }}" dist "${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.flutter_arch }}
          path: dist/*

  android:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          else
            echo "::warning::No Android signing secrets; APKs will be signed with the debug key."
          fi
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release
      - name: Package
        run: |
          V='${{ needs.meta.outputs.version }}'
          O=build/app/outputs/flutter-apk
          mkdir -p dist
          cp "$O/app-release.apk"           "dist/Spotifin_Android_v${V}.apk"
          cp "$O/app-arm64-v8a-release.apk"   "dist/Spotifin_AndroidARM64_v${V}.apk"
          cp "$O/app-armeabi-v7a-release.apk" "dist/Spotifin_AndroidARM32_v${V}.apk"
          cp "$O/app-x86_64-release.apk"      "dist/Spotifin_AndroidX64_v${V}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  release:
    needs: [meta, windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and manifest
        run: |
          cd dist
          for f in *; do sha256sum "$f" | awk '{print $1}' > "$f.sha256"; done
          python3 - <<'PY'
          import hashlib, json, os, datetime
          assets = []
          for n in sorted(os.listdir('.')):
              if n.endswith('.sha256'):
                  continue
              h = hashlib.sha256(open(n, 'rb').read()).hexdigest()
              assets.append({'name': n, 'size': os.path.getsize(n), 'sha256': h})
          json.dump({
              'name': 'Spotifin',
              'version': '${{ needs.meta.outputs.version }}',
              'commit': os.environ['GITHUB_SHA'],
              'built_at': datetime.datetime.utcnow().isoformat() + 'Z',
              'assets': assets,
          }, open('build-manifest.json', 'w'), indent=2)
          PY
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: Spotifin v${{ needs.meta.outputs.version }}
          draft: true
          generate_release_notes: true
          files: dist/*
