name: jelly_music
description: Player de música pessoal baseado em Jellyfin (Android, Windows, Linux futuro).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  just_audio: ^0.9.40
  # just_audio não tem backend nativo para Windows/Linux; media_kit (libmpv) cobre os dois.
  just_audio_media_kit: ^2.0.5
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.1.3
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
