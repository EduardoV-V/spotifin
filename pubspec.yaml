name: spotifin
description: Spotify-style music player for your Jellyfin library (Android, Windows, Linux).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  just_audio: ^0.9.40
  # just_audio não tem backend nativo para Windows/Linux; media_kit (libmpv) cobre os dois.
  just_audio_media_kit: ^2.0.5
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.1.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.6
  web_socket_channel: ^3.0.3
  audio_service: ^0.18.19
  flutter_foreground_task: ^11.0.3
  file_picker: ^8.1.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Spotifin
      fonts:
        - asset: assets/fonts/Spotifin-Light.ttf
          weight: 300
        - asset: assets/fonts/Spotifin-Regular.ttf
          weight: 400
        - asset: assets/fonts/Spotifin-Medium.ttf
          weight: 500
        - asset: assets/fonts/Spotifin-Bold.ttf
          weight: 700
        - asset: assets/fonts/Spotifin-Extrabold.ttf
          weight: 800
        - asset: assets/fonts/Spotifin-Ultra.ttf
          weight: 900
